services:
  db:
    image: postgres:16-alpine
    container_name: mercado-paramo-db
    environment:
      POSTGRES_DB: mercado_paramo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d mercado_paramo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: